site_name: MkDocs 테마 미리보기
site_description: Blog theme preview for the MkDocs comparison
site_url: https://example.com
docs_dir: docs
site_dir: site
theme:
  name: material
  language: ko
  palette:
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: 어두운 청록 테마 보기
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 밝은 초록 테마 보기
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: 어두운 초록 테마 보기
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - content.code.copy
nav:
  - 홈: index.md
  - 테마 미리보기: theme-preview.md
  - 블로그:
      - Pages 자동 배포: blog/cloudflare-static-blog-pipeline.md
markdown_extensions:
  - admonition
  - toc:
      permalink: true
